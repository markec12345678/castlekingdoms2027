name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    name: Lua Lint (luacheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Install luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y luarocks
          sudo luarocks install luacheck

      - name: Run luacheck
        run: luacheck . --config .luacheckrc --no-cache

  yaml-validate:
    name: Validate YAML locale files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate all locale YAML files
        run: |
          python3 - <<'EOF'
          import yaml, glob, sys
          errors = []
          for f in sorted(glob.glob('locale/*.yaml')) + sorted(glob.glob('locale/source/*.yaml')):
              try:
                  with open(f, encoding='utf-8') as fp:
                      data = yaml.safe_load(fp)
                  if not isinstance(data, dict):
                      errors.append(f"{f}: root is not a dict")
                  else:
                      print(f"OK: {f} ({len(data)} top-level keys)")
              except Exception as e:
                  errors.append(f"{f}: {e}")
          if errors:
              print("\n--- ERRORS ---")
              for e in errors:
                  print(" -", e)
              sys.exit(1)
          EOF

  build:
    name: Build test (.love package)
    runs-on: ubuntu-latest
    needs: [lint, yaml-validate]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Create .love package
        run: |
          zip -0 -r stronghold2027.love . -x '*.git*' '.github/*' 'BUGFIX_STRATEGY.md' 'FORK_NOTICE.md'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stronghold2027-love
          path: stronghold2027.love
          retention-days: 14

  custom-tests:
    name: Custom project tests
    runs-on: ubuntu-latest
    needs: [lint, yaml-validate]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libreadline-dev
          curl -L -o lua-5.1.tar.gz https://www.lua.org/ftp/lua-5.1.5.tar.gz
          tar -xzf lua-5.1.tar.gz
          cd lua-5.1.5
          sed -i 's/MYCFLAGS=-DLUA_USE_LINUX/MYCFLAGS="-DLUA_USE_POSIX"/' src/Makefile
          sed -i 's/MYLIBS="-Wl,-E -ldl -lreadline -lhistory -lncurses"/MYLIBS="-Wl,-E -ldl"/' src/Makefile
          make posix
          sudo cp src/lua src/luac /usr/local/bin/

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run custom project tests
        run: lua scripts/test.lua
