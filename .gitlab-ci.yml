stages:
  - test

image: ubuntu:artful

cache:
  key: ${CI_COMMIT_REF_SLUG}

run: 
  stage: test
  script:
    - apt-get update
    - apt-get install --assume-yes zip
    - zip -9 -r test.love .
    - apt-get install --assume-yes git
    - apt-get install --assume-yes libmodplug1
    - apt-get install --assume-yes libmpg123-0
    - apt-get install --assume-yes libogg0
    - apt-get install --assume-yes libopenal1
    - apt-get install --assume-yes libphysfs1
    - apt-get install --assume-yes libsdl2-2.0-0
    - apt-get install --assume-yes libluajit-5.1-2
    - apt-get install --assume-yes libtheora0
    - apt-get install --assume-yes libvorbisfile3
    - apt-get install --assume-yes libfreetype6
    - dpkg -i libraries/love/liblove0_0.10.2ppa1_amd64.deb
    - dpkg -i libraries/love/love_0.10.2ppa1_amd64.deb
    - cat /usr/bin/love test.love > testbuild
    - chmod a+x ./testbuild
    - apt-get install --assume-yes luarocks
    - luarocks install luacheck
    - luarocks install luacov
    - luarocks install luacov-console
    - luarocks install dkjson
    - luarocks install luasystem
    - luarocks install lua_cliargs
    - luarocks install say
    - luarocks install luassert
    - luarocks install lua-term
    - luarocks install penlight
    - luarocks install mediator_lua  
    - ls 
    - rm -r busted
    - rm -r libraries 
    - rm -r spec 
    - rm -r objects/objects_quads.lua
    - RES=$(./testbuild --verbose --coverage --test) || { echo "$RES"; exit 1; }
    - luacov
    - cat luacov.report.out
    - luacov-console 
    - luacov-console -s && echo "$RES"   
    
