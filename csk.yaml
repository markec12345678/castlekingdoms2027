mission1:
  name: Drevo a Kameň
  desc: |
    V tejto misii sa budete musieť zamerať na zhromažďovanie zdrojov na rozvoj infraštruktúry vášho kráľovstva.
Vaším cieľom je v priebehu nasledujúcich 5 rokov nazbierať 50 jednotiek dreva a 20 jednotiek kameňa.

Na dosiahnutie tohto cieľa budete musieť vybudovať sieť drevorubačských chatrčí a lomov, aby ste tieto zdroje ťažili z okolitého prostredia.
To môže zahŕňať výstavbu zásob na uskladnenie vašich zdrojov.
mission2:
  name: Preteky v zbrojení
  desc: |
    V tejto misii sa budete musieť zamerať na rozvoj silnej armády na obranu svojho kráľovstva pred potenciálnymi hrozbami.
Vaším cieľom je v priebehu nasledujúcich 20 rokov vyrobiť 40 kusov lukov, oštepov, kyjakov a brnení.\n
Aby ste to dosiahli, budete musieť vybudovať robustný kovospracujúci priemysel na výrobu vysokokvalitných zbraní a brnení.
To môže zahŕňať výstavbu kováčov, dielní a baní, ako aj nábor zručných remeselníkov.\n
Majte na pamäti, že váš úspech v tejto misii bude závisieť od vašej schopnosti vyvážiť svoje zdroje a uprednostniť svoje ciele.
Budete musieť starostlivo spravovať svoje financie a robiť strategické rozhodnutia, aby ste zaistili bezpečnosť a ochranu svojho kráľovstva. Veľa šťastia!
mission3:
  name: Hostina alebo hladomor
  desc: |
    V tejto misii sa budete musieť zamerať na produkciu potravín, aby ste udržali svoju rastúcu populáciu. Vaším cieľom je v priebehu nasledujúcich 20 rokov vyprodukovať 250 jednotiek chleba, 100 jednotiek mäsa, 200 jednotiek syra a 250 jednotiek jabĺk.\n
Na dosiahnutie tohto cieľa budete musieť vyvinúť robustný poľnohospodársky systém na pestovanie plodín a chov hospodárskych zvierat. To si bude vyžadovať výstavbu fariem, mlynov a pastvín, ako aj nábor kvalifikovaných pracovníkov.\n
Okrem produkcie potravín budete musieť zvážiť aj skladovanie a distribúciu týchto zdrojov. To môže zahŕňať výstavbu sýpok a trhovísk na skladovanie a predaj vašich produktov.\n
Majte na pamäti, že váš úspech v tejto misii bude závisieť od vašej schopnosti vyvážiť svoje zdroje a uprednostniť svoje ciele. Budete musieť starostlivo spravovať svoje financie a robiť strategické rozhodnutia, aby ste zabezpečili prosperitu svojho kráľovstva. Veľa šťastia!
mission4:
  name: Šťastie kráľovstva
  desc: |
    V tejto misii je vaším cieľom nahromadiť značné množstvo bohatstva získaním 5 000 jednotiek zlata.
Na rozdiel od predchádzajúcich misií nie je tento cieľ časovo obmedzený, takže budete mať slobodu sledovať svoje ciele vlastným tempom.\n
Na dosiahnutie tohto cieľa budete musieť vybudovať silnú ekonomiku budovaním a riadením dielní, investovaním do obchodu a komerčných činností a prijímaním strategických finančných rozhodnutí.\n
Majte na pamäti, že váš úspech v tejto misii bude závisieť od vašej schopnosti rozumne investovať a starostlivo spravovať svoje financie.
Budete musieť vyvážiť svoje zdroje a podstupovať premyslené riziká, aby ste zabezpečili prosperitu svojho kráľovstva. Veľa šťastia!
mission5:
  name: Viera v architektúre
  desc: |
    V tejto misii sa budete musieť zamerať na výstavbu veľkolepej katedrály, ktorá bude slúžiť ako ústredný bod náboženského a kultúrneho života vášho kráľovstva.
Vaším cieľom je postaviť katedrálu v priebehu nasledujúcich 10 rokov.\n
Majte na pamäti, že váš úspech v tejto misii bude závisieť od vašej schopnosti riadiť zložitý stavebný projekt a efektívne vyvážiť svoje zdroje.
Budete musieť robiť strategické rozhodnutia a starostlivo si riadiť čas, aby ste zabezpečili dokončenie svojej katedrály v stanovenom časovom rámci. Veľa šťastia!
