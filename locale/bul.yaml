mission1:
  name: Дърво и камък
  desc: 'В тази мисия се фокусирайте върху събирането на ресурси за развитието на
    инфраструктурата на вашето кралство.

    Вашата цел е да съберете 50 единици дърво и 20 единици камък в следващите 5 години.'
mission2:
  name: Надпревара във въоръжаването
  desc: 'В тази мисия развийте силна армия за защита на кралството.

    Вашата цел е да произведете 40 единици лъкове, копия, боздугани и броня в следващите
    20 години.'
mission3:
  name: Празник или глад
  desc: 'В тази мисия се фокусирайте върху производството на храна.

    Вашата цел е да произведете 250 единици хляб, 100 единици месо, 200 единици сирене
    и 250 единици ябълки в следващите 20 години.'
mission4:
  name: Богатството на кралството
  desc: 'В тази мисия вашата цел е да натрупате 5000 единици злато.

    Развийте силна икономика чрез търговия и занаяти.'
mission5:
  name: Вяра в архитектурата
  desc: В тази мисия изградете величествена катедрала в следващите 10 години.
