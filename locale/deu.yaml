mission1:
  name: Holz und Stein
  desc: |
    Bei dieser Mission müsst ihr euch darauf konzentrieren Ressourcen zu sammeln um die Infrastruktur eures Königreiches zu entwickeln. Eure Aufgabe ist es 50 Einheiten Holz und 20 Einheiten Stein in den nächsten 5 Jahren zu beschaffen.\n
    Um dies zu erreichen werdet ihr einige Holzfäller und Steinbrüche benötigen, die euch die nötigen Ressourcen aus der Umgebung liefern.
    Um die Ressourcen zu lagern, könnte der Bau von Vorratslagern nötig sein.
mission2:
  name: Wettrüsten
  desc: |
    Bei dieser Mission müsst ihr euch darauf konzentrieren ein starkes Militär aufzubauen, um euer Königreich gegen potentielle Feinde verteidigen zu können. Eure Aufgabe ist es innerhalb der nächsten 20 Jahre jeweils 40 Bögen, Speere, Streitkolben und Rüstungen zu produzieren.\n
    Um dies zu erreichen, müsst ihr eine funktionsfähige Metallverarbeitungsindustrie aufbauen, die hochqualitative Waffen und Rüstungen herstellen kann.
    Dies erfordert den Bau von Schmieden, diversen Werkstätten und Eisenminen, sowie das Rekrutieren geschickter Handwerker.\n
    Bedenkt, dass der Erfolg dieser Mission von euren Fähigkeiten abhängt, wie ihr Ressourcen verwalten und gleichzeitig eure Ziele priorisieren könnt.
    Ihr müsst eure Finanzen gut verwalten und richtige strategische Entscheidungen treffen, um die Sicherheit eures Königsreichs sicherzustellen. Viel Glück!
mission3:
  name: Festmahl oder Hungersnot
  desc: |
    Bei dieser Mission müsst ihr euch auf eure Nahrungsmittelproduktion konzentrieren, um eure wachsende Bevölkerung zu versorgen. Euer Ziel ist es in den nächsten 20 Jahren 250 Einheiten Brot, 100 Einheiten Fleisch, 200 Einheiten Käse und 250 Einheiten Äpfel heranzuschaffen.\n
    Damit ihr dies erreicht, müsst ihr ein ertragreiches Agrarsystem aufbauen, um Früchte anzubauen und Vieh zu züchten.
    Dies erfordert den Bau von Farmen, Mühlen und Weiden, sowie das Rekrutieren erfahrener Arbeiter.\n
    Zusätzlich zur Nahrungsmittelproduktion, müsst ihr auch die Lagerung und Verteilung dieser Ressourcen berücksichtigen. Kornspeicher und Märkte können euch helfen die Waren zu lagern und zu verkaufen.\n
    Bedenkt, dass der Erfolg dieser Mission von euren Fähigkeiten abhängt, wie ihr Ressourcen verwalten und gleichzeitig eure Ziele priorisieren könnt.
    Ihr müsst eure Finanzen gut verwalten und richtige strategische Entscheidungen treffen, um den Wohlstand eures Königsreichs sicherzustellen. Viel Glück!
mission4:
  name: The Kingdom's Fortune
  desc: |
    In this mission, your goal is to accumulate a substantial amount of wealth by acquiring 5000 units of gold.
    Unlike previous missions, there is no time limit on this objective, so you will have the freedom to pursue your goals at your own pace.\n
    To achieve this, you will need to develop a strong economy by building and managing workshops, investing in trade and commerce, and making strategic financial decisions.\n
    Keep in mind that your success in this mission will depend on your ability to make wise investments and manage your finances carefully.
    You will need to balance your resources and take calculated risks to ensure the prosperity of your kingdom. Good luck!
mission5:
  name: Faith in Architecture
  desc: |
    In this mission, you will need to focus on constructing a grand cathedral to serve as the centerpiece of your kingdom's religious and cultural life.
    Your objective is to build a cathedral within the next 10 years.\n
    Keep in mind that your success in this mission will depend on your ability to manage a complex construction project and balance your resources effectively.
    You will need to make strategic decisions and manage your time carefully to ensure the completion of your cathedral within the allotted timeframe. Good luck!
