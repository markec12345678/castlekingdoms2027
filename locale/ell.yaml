mission1:
  name: Ξυλεία και Πέτρα
  desc: 'Σε αυτή την αποστολή, εστιάστε στη συλλογή πόρων για την ανάπτυξη της υποδομής
    του βασιλείου σας.

    Στόχος σας είναι να συλλέξετε 50 μονάδες ξυλείας και 20 μονάδες πέτρας στις επόμενες
    5 χρόνια.

    Για να το πετύχετε αυτό, θα πρέπει να εγκαθιδρύσετε ένα δίκτυο καλύβων υλοτόμων
    και λατομείων.'
mission2:
  name: Καταρτισμός Όπλων
  desc: 'Σε αυτή την αποστολή, αναπτύξτε έναν ισχυρό στρατό για την άμυνα του βασιλείου.

    Στόχος σας είναι να παραγάγετε 40 μονάδες τόξων, δοράτων, ροπάλων και θωράκων
    στις επόμενες 20 χρόνια.'
mission3:
  name: Εορτή ή Πείνα
  desc: 'Σε αυτή την αποστολή, εστιάστε στην παραγωγή τροφίμων.

    Στόχος σας είναι να παραγάγετε 250 μονάδες ψωμιού, 100 μονάδες κρέατος, 200 μονάδες
    τυριού και 250 μονάδες μήλων στις επόμενες 20 χρόνια.'
mission4:
  name: Η Τύχη του Βασιλείου
  desc: 'Σε αυτή την αποστολή, στόχος σας είναι να συσσωρεύσετε 5000 μονάδες χρυσού.

    Αναπτύξτε μια ισχυρή οικονομία μέσω εμπορίου και χειροτεχνίας.'
mission5:
  name: Πίστη στην Αρχιτεκτονική
  desc: Σε αυτή την αποστολή, χτίστε έναν μεγαλοπρεπή καθεδρικό ναό στις επόμενες
    10 χρόνια.
