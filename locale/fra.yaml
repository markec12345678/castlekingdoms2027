mission1:
  name: Bois et Pierre
  desc: |
    Dans cette mission, vous devrez vous concentrer sur la récolte des ressources pour développer l'infrastructure de votre royaume.
    Votre objectif est de collecter 50 unités de bois et 20 unités de pierre dans les 5 prochaines années.\n
    Pour y arriver, vous devrez établir a réseau de cabanes de bûcheron et de carrières pour extraire ces ressources de l'environnement qui vous entoure.
    Cela vous ammènera peut-être à construire des stocks pour stocker vos ressources.
mission2:
  name: Course à l'Armement
  desc: |
    Dans cette mission, vous allez devoir vous concentrer sur la constitution d'une grande armée pour défendre votre royaume contre de potentielles attaques.
    Votre objectif est de produire des arcs, lances, masses et armure, pour 40 unités de chaque en 20 ans.\n
    Pour réussir cela, vous allez avoir besoin d'établir une robuste industrie métallurgique pour fabriquer des armes et armures de haute qualité.
    Cela peut induire la construction de forges, marchés et des mines, avec bien sûr le recrutement d'artisans compétant.\n
    Gardez à l'esprit que votre succès dans cette mission va dépendre de vos habilitées à équilibrer vos ressources et prioriser vos buts.
    Vous allez avoir besoin de faire attention à votre gestion des finances et de prendre des décisions stratégiques pour assurer la sécurité et la sureté de vôtre royaume. Bonne chance!
mission3:
  name: Festin ou famine
  desc: |
    Dans cette mission, vous allez avoir besoin de vous concentrer sur la production de nourriture pour soutenir l'accroissement de votre population. Votre but est de produire 250 unités de pain,
    100 unités de viande,
    200 unités de fromage, et 250 unités de pomme en 20 ans.\n
    Pour y parvenir, vous devrez développer un système agricole robuste en faisant pousser des cultures et en élevant du bétail.
    Cela va requerir la construction de fermes, de moulins et de pâturages, avec biensûr le recrutement de fermiers experimentés.\n
    En plus de la production de nourriture, vous allez aussi avoir besoin de considérer le stockage et la distribution de ces ressources. Ce qui peut induire la construction de greniers et de marchés pour stocker et vendre vos productions.\n
    Gardez à l'esprit que votre succès dans cette mission va dépendre de vos habilitées dans la gestion de vos ressources et prioriser vos objectifs. Vous allez avoir besoin de gérer avec attention vos finances et prendre des décisions stratégiques pour assurer la prospéritée de vôtre royaume. Bonne chance!
mission4:
  name: La Fortune du Royaume
  desc: |
    Dans cette mission, votre but est d'accumuler une quantitée pharamineuse d'or.
    Contrairement à vos précédentes missions, il n'y a pas de limite de temps pour cet objectif, vous allez donc avoir la libertée de suivre vôtre propre rythme pour atteindre votre objectif.\n
    Pour réussir cela, vous aurez besoin de développer une économie forte par la construction et la gestion de vos marchés via les échanges et le commerce, et donc faire des décisions financières statégiques.\n
    Gardez à l'esprit que votre succès dans cette mission va dépendre de vos habilitées à faire de bons investissements et gérer vos finances avec attention.
    Vous allez avoir besoin de gérer vos ressources et de calculer les risques pour assurer la prospéritée de vôtre royaume. Bonne chance!
mission5:
  name: La Foi dans l'Architecture
  desc: |
    Dans cette mission, vous allez vous devoir concentrer sur la construction d'une grande cathédrale pour servir de pièce centrale pour la religion et la vie culturelle de vôtre royaume.
    Votre objectif est de construire une cathédrale en 10 ans.\n
    Gardez en tête que votre succès dans cette mission va dépendre de vos habilitées à gérer un projet complexe de construction et d'avoir un équilibre de vos ressources efficace.
    Vous allez avoir besoin de prendre des décisions stratégiques et de gérer votre temps avec attention pour être sûr de construire vôtre cathédrale dans le temps imparti. Bonne chance!
