mission1:
  name: Faanyag és Kő
  desc: |
    Ebben a küldetésben arra kell összpontosítanod, hogy erőforrásokat gyűjts a királyságod infrastruktúrájának fejlesztéséhez.
    A cél az, hogy a következő 5 évben 50 egység fát és 20 egység követ gyűjts össze.\n
    Ennek eléréséhez favágó kunyhók és kőbányák hálózatát kell létrehoznod, hogy kinyerd ezeket az erőforrásokat a környezetedből.
    Ez magában foglalhatja az erőforrások tárolására szolgáló készletek felépítését is.
mission2:
  name: Fegyverkezési verseny
  desc: |
    Ebben a küldetésben egy erős hadsereg kialakítására kell összpontosítanod, hogy meg tudd védeni a királyságod a lehetséges fenyegetésekkel szemben.
    A cél az, hogy a következő 20 évben 40 darab íjat, lándzsát, buzogányt és páncélt állíts elő.\n
    Ennek eléréséhez robusztus fémmegmunkáló ipart kell létrehoznod a kiváló minőségű fegyverek és páncélok készítéséhez.
    Ez magában foglalhatja kovácsok, műhelyek és bányák építését, valamint szakképzett kézművesek toborzását.\n
    Ne feledd, hogy a küldetésben elért sikered azon múlik, hogy képes vagy-e egyensúlyba hozni erőforrásaid és prioritást adni a céljaidnak.
    Gondosan kell kezelned pénzügyeid, és stratégiai döntéseket kell hoznod, hogy biztosítsd királyságod biztonságát. Sok szerencsét!
mission3:
  name: Ünnep vagy éhínség
  desc: |
    Ebben a küldetésben az élelmiszer termelésre kell összpontosítanod, hogy fenntartsd növekvő népességed. A célod, hogy a következő 20 évben előállíts 250 egység kenyeret, 100 egység húst, 200 egység sajtot, és 250 egység almát.\n
    Ennek eléréséhez robusztus mezőgazdasági rendszert kell kidolgoznod a növénytermesztéshez és az állattenyésztéshez. Ehhez farmok, malmok és legelők építésére, valamint szakképzett munkaerő toborzására lesz szükséged.\n
    Az élelmiszer-termelésen kívül, ezen erőforrások tárolását, és elosztását is figyelembe kell venned. Ez magában foglalhatja magtárak és piacok építését a termékek tárolására és értékesítésére.\n
    Ne feledd, a küldetésben elért sikered azon múlik, hogy képes vagy-e egyensúlyba hozni erőforrásaid és prioritást adni a céljaidnak. Gondosan kell kezelned pénzügyeid, és stratégiai döntéseket kell hoznod, hogy biztosítsd birodalmad jólétét. Sok szerencsét!
mission4:
  name: A Királyság szerencséje
  desc: |
    Ebben a küldetésben az a cél, hogy jelentős mennyiségű vagyont halmozz fel 5000 egység arany megszerzésével.
    A korábbi küldetésekkel ellentétben ennek a célkitűzésnek nincs időkorlátja, így szabadon követheted céljaid a saját tempódban.\n
    Ennek eléréséhez erős gazdaságot kell kialakítanod, műhelyek építésével és irányításával, kereskedelembe való befektetéssel, valamint stratégiai pénzügyi döntések meghozatalával.\n
    Ne feledd, hogy a küldetésben elért sikered azon múlik, hogy képes vagy-e bölcs befektetésekre és gondosan kezelni pénzügyeid.
    Ki kell egyensúlyoznod erőforrásaidat, és kiszámított kockázatokat kell vállalnod, hogy biztosítsd királyságod jólétét. Sok szerencsét!
mission5:
  name: Az építészetbe vetett hit
  desc: |
    Ebben a küldetésben egy hatalmas katedrális felépítésére kell összpontosítanod, amely királyságod vallási és kulturális életének központi elemeként szolgálhat.
    A célod egy katedrális felépítése a következő 10 éven belül.\n
    Ne feledd, hogy a küldetésben elért sikered azon múlik, hogy képes vagy-e irányítani egy összetett építési projektet, és hatékonyan kiegyensúlyozni az erőforrásaid.
    Stratégiai döntéseket kell hoznod, és gondosan kell beosztanod az időt annak érdekében, hogy a katedrális a megadott időkereten belül elkészüljön. Sok szerencsét!
