mission1:
  name: Legname e Pietra
  desc: |
    In questa missione, dovrai concentrarti sulla raccolta di risorse per sviluppare l'infrastruttura del tuo regno.
    Il tuo obiettivo è quello di raccogliere 50 unità di legno e 20 unità di pietra entro i prossimi 5 anni.\n
    Per raggiungere questo obiettivo, sarà necessario istituire una rete di capanne dei taglialegna e cave per estrarre queste risorse dall'ambiente circostante.
    Potresti anche necessitare della costruzione di magazzini per conservare le tue risorse.
mission2:
  name: Corsa alle Armi
  desc: |
    In questa missione, dovrai concentrarti sullo sviluppo di un forte esercito per difendere il tuo regno dalle potenziali minacce.
    Il tuo obiettivo è quello di produrre 40 unità ciascuno di archi, lance, mazze e armature entro i prossimi 20 anni.\n
    Per raggiungere questo obiettivo, dovrai stabilire una robusta industria di lavorazione dei metalli per produrre armi e armature di alta qualità.
    Ciò può comportare la costruzione di fabbri, armaioli e miniere, nonché il reclutamento di lavoratori qualificati.\n
    Ricordati che il tuo successo in questa missione dipenderà dalla tua capacità di bilanciare le tue risorse e di dare priorità ai tuoi obiettivi.
    Dovrai gestire attentamente le tue finanze e prendere decisioni strategiche per garantire la sicurezza del tuo regno. Buona fortuna!
mission3:
  name: Tutto o Niente
  desc: |
    In questa missione, dovrai concentrarti sulla produzione di cibo per sostenere la tua crescente popolazione. Il tuo obiettivo è quello di produrre 250 unità di pane,
    100 unità di carne,
    200 unità di formaggio e 250 unità di mele nei prossimi 20 anni.\n
    Per raggiungere questo obiettivo, è necessario sviluppare un robusto sistema agricolo per coltivare il raccolto e allevare il bestiame. Ciò richiederà la costruzione di fattorie, mulini e pascoli, nonché il reclutamento di lavoratori qualificati.\n
    Oltre alla produzione alimentare, dovrai anche considerare la conservazione e la distribuzione di queste risorse. Questo può comportare la costruzione di granai e mercati per immagazzinare e vendere i vostri prodotti.\n
    Tieni presente che il tuo successo in questa missione dipenderà dalla tua capacità di bilanciare le tue risorse e di dare priorità ai tuoi obiettivi. Dovrai gestire attentamente le tue finanze e prendere decisioni strategiche per garantire la prosperità del tuo regno. Buona fortuna!
mission4:
  name: Il Patrimonio del Regno
  desc: |
    In questa missione, il tuo obiettivo è quello di accumulare una notevole quantità di ricchezza acquisendo 5000 unità d'oro.
    A differenza delle missioni precedenti, non vi è alcun limite di tempo, così avrai la libertà di perseguire i tuoi obiettivi secondo il tuo ritmo.\n
    Per raggiungere questo obiettivo, dovrai sviluppare un'economia forte, costruendo e gestendo botteghe, investendo nel commercio e prendendo decisioni finanziarie strategiche.\n
    Ricordati che il tuo successo in questa missione dipenderà dalla tua capacità di effettuare investimenti saggi e gestire le proprie finanze con attenzione.
    Dovrai bilanciare le tue risorse e considerare i rischi calcolati per garantire la prosperità del tuo regno. Buona fortuna!
mission5:
  name: Fede Nell'Architettura
  desc: |
    In questa missione, dovrai concentrarti sulla costruzione di una grande cattedrale per servire come fulcro della vita religiosa e culturale del tuo regno.
    Il tuo obiettivo è quello di costruire una cattedrale entro i prossimi 10 anni.\n
    Ricordati che il tuo successo in questa missione dipenderà dalla tua capacità di gestire un complesso progetto di costruzione e di bilanciare le tue risorse in modo efficace.
    Dovrai prendere decisioni strategiche e gestire attentamente il tuo tempo per garantire il completamento della tua cattedrale entro i tempi previsti. Buona fortuna!
