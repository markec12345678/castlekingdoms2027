mission1:
  name: Koks un Akmens
  desc: 'Šajā misijā koncentrējieties uz resursu vākšanu, lai attīstītu jūsu karalistes
    infrastruktūru.

    Jūsu mērķis ir savākt 50 vienības koksnes un 20 vienības akmens nākamo 5 gadu
    laikā.'
mission2:
  name: Ieroču Sacensība
  desc: 'Šajā misijā izveidojiet stipru armiju karalistes aizsardzībai.

    Jūsu mērķis ir saražot 40 vienības loku, šķēpu, veseru un bruņu nākamo 20 gadu
    laikā.'
mission3:
  name: Dzīre vai Bads
  desc: 'Šajā misijā koncentrējieties uz pārtikas ražošanu.

    Jūsu mērķis ir saražot 250 vienības maizes, 100 vienības gaļas, 200 vienības siera
    un 250 vienības ābolu nākamo 20 gadu laikā.'
mission4:
  name: Karalistes Bagātība
  desc: 'Šajā misijā jūsu mērķis ir uzkrāt 5000 vienības zelta.

    Izveidojiet stipru ekonomiku caur tirdzniecību un amatiem.'
mission5:
  name: Ticība Arhitektūrai
  desc: Šajā misijā uzbūvējiet majestātisku katedrāli nākamo 10 gadu laikā.
