mission1:
  name: Mediena ir Akmuo
  desc: 'Šioje misijoje sutelkite dėmesį į išteklių rinkimą, kad vystytumėte karalystės
    infrastruktūrą.

    Jūsų tikslas – surinkti 50 vienetų medienos ir 20 vienetų akmens per kitus 5 metus.'
mission2:
  name: Ginklavimosi Varžybos
  desc: 'Šioje misijoje sukurkite stiprią kariuomenę karalystės gynybai.

    Jūsų tikslas – pagaminti 40 vienetų lankų, ietų, kuokų ir šarvų per kitus 20 metų.'
mission3:
  name: Puota arbad Alkis
  desc: 'Šioje misijoje sutelkite dėmesį į maisto gamybą.

    Jūsų tikslas – pagaminti 250 vienetų duonos, 100 vienetų mėsos, 200 vienetų sūrio
    ir 250 vienetų obuolių per kitus 20 metų.'
mission4:
  name: Karalystės Turtai
  desc: 'Šioje misijoje jūsų tikslas – sukaupti 5000 vienetų aukso.

    Sukurkite stiprią ekonomiką per prekybą ir amatus.'
mission5:
  name: Tikėjimas Architektūra
  desc: Šioje misijoje pastatykite didingą katedrą per kitus 10 metų.
