mission1:
  name: Дрво и камен
  desc: 'Во оваа мисија фокусирајте се на собирање ресурси за развој на инфраструктурата
    на вашето кралство.

    Вашата цел е да соберете 50 единици дрво и 20 единици камен во наредните 5 години.'
mission2:
  name: Трка во вооружувањето
  desc: 'Во оваа мисија развијте силна војска за одбрана на кралството.

    Вашата цел е да произведете 40 единици лакови, копја, буздавани и оклоп во наредните
    20 години.'
mission3:
  name: Празник или глад
  desc: 'Во оваа мисија фокусирајте се на производство на храна.

    Вашата цел е да произведете 250 единици леб, 100 единици месо, 200 единици сирење
    и 250 единици јаболка во наредните 20 години.'
mission4:
  name: Богатството на кралството
  desc: 'Во оваа мисија вашата цел е да акумулирате 5000 единици злато.

    Развијте силна економија преку трговија и занаети.'
mission5:
  name: Вера во архитектурата
  desc: Во оваа мисија изградете величествена катедрала во наредните 10 години.
