mission1:
  name: Hout en Steen
  desc: |
    Tijdens deze missie, ligt de focus op het verzamelen van grondstoffen om jouw koninkrijk verder te ontwikkelen.
    Het doel is om binnen 5 jaar minimaal 50 eenheden hout en 20 eenheden steen te verzamelen.\n
    Om dit te bereiken, moet je een netwerk van houthakkers en steengroeven opzetten om deze eenheden uit de omgeving te verzamelen.
    Denk eraan dat je mogelijk extra voorraden moet bouwen om deze grondstoffen op te slaan.
mission2:
  name: Wapenwedloop
  desc: |
    Tijdens deze missie, ligt de focus op het ontwikkelen van een sterk leger om jouw koninkrijk te verdedigen.
    Het doel is om binnen 20 jaar minimaal 40 eenheden aan bogen, speren, knotsen en pantsers te produceren.\n
    Om dit te bereiken, moet je een metaalindustrie opzetten die van hoogwaardige kwaliteit wapens en pantsers kan maken.
    Denk hierbij aan het bouwen van ijzersmeden, werkplaatsen en steen- en ijzergroeven, maar ook aan het werven van ambachtslieden.\n
    Het succes van deze missie hangt af van jouw vaardigheden om de grondstoffen te beheren tot het stellen van de juiste doelen.
    Je zult je financiën zorgvuldig moeten beheren en strategische beslissingen moeten nemen om de veiligheid van jouw koninkrijk te garanderen. Veel succes!
mission3:
  name: Feest of Hongersnood
  desc: |
    Tijdens deze missie, ligt de focus op het produceren van voldoende voedsel waarmee je je groeiende bevolking in stand houdt. Het doel is om 250 eenheden aan brood, 100 eenheden aan vlees, 200 eenheden aan kaas en 250 eenheden aan appels to produceren binnen 20 jaar.\n
    Om dit te bereiken, moet je een landbouwsysteem opzetten dat bestaat uit het houden van vee en het verbouwen van gewassen. Dit vereist het bouwen van boederijen, molen en weilande, maar ook het aannemen arbeiders.\n
    Daarnaast moet je ook nadenken over de opslag en distributie van al het voedsel. Hiervoor is het mogelijk dat je extra graanschuren voor meer opslag moet bouwen of een markt om producten te verkopen.\n
    Het succes van deze missie hangt af van jouw vaardigheden om de middelen die je hebt te beheren tot het stellen van de juiste doelen. Je zult met de middelen moeten werken die je hebt en belangrijke beslissingen moeten maken, zodat de welvaart van je koninkrijk is verzekerd. Veel succes!
mission4:
  name: The Kingdom's Fortune
  desc: |
    In this mission, your goal is to accumulate a substantial amount of wealth by acquiring 5000 units of gold.
    Unlike previous missions, there is no time limit on this objective, so you will have the freedom to pursue your goals at your own pace.\n
    To achieve this, you will need to develop a strong economy by building and managing workshops, investing in trade and commerce, and making strategic financial decisions.\n
    Keep in mind that your success in this mission will depend on your ability to make wise investments and manage your finances carefully.
    You will need to balance your resources and take calculated risks to ensure the prosperity of your kingdom. Good luck!
mission5:
  name: Faith in Architecture
  desc: |
    In this mission, you will need to focus on constructing a grand cathedral to serve as the centerpiece of your kingdom's religious and cultural life.
    Your objective is to build a cathedral within the next 10 years.\n
    Keep in mind that your success in this mission will depend on your ability to manage a complex construction project and balance your resources effectively.
    You will need to make strategic decisions and manage your time carefully to ensure the completion of your cathedral within the allotted timeframe. Good luck!
