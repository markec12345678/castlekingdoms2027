mission3:
    name: Uczta czy głód
    desc: |
      W tej misji będziesz musiał skupić się na produkcji żywności, aby utrzymać rosnącą populację. Twoim celem jest wyprodukowanie 250 jednostek chleba, 100 jednostek mięsa, 200 jednostek sera i 250 jednostek jabłek w ciągu najbliższych 20 lat.

      Aby to osiągnąć, będziesz musiał rozwinąć solidny system rolnictwa, aby uprawiać rośliny i hodować zwierzęta. Będzie to wymagało budowy farm, młynów i pastwisk, a także rekrutacji wykwalifikowanych robotników.

      Oprócz produkcji żywności, będziesz musiał również rozważyć przechowywanie i dystrybucję tych zasobów. Może to obejmować budowę spichlerzy i rynków do przechowywania i sprzedaży produktów.

      Należy pamiętać, że sukces w tej misji będzie zależał od umiejętności równoważenia zasobów i ustalania priorytetów. Będziesz musiał ostrożnie zarządzać swoimi finansami i podejmować strategiczne decyzje, aby zapewnić dobrobyt swojemu królestwu. Powodzenia!

