mission1:
  name: Kłoda i Kamień
  desc: |
    W tej misji będziesz musiał skupić się na gromadzeniu zasobów, aby rozwinąć infrastrukturę swojego królestwa.
    Twoim celem jest zebranie 50 sztuk drewna i 20 sztuk kamienia w ciągu najbliższych 5 lat.\n
    Aby to osiągnąć, będziesz musiał stworzyć sieć chat drwali i kamieniołomów, aby wydobywać te zasoby z otaczającego środowiska.
    Może to wymagać budowy składów do przechowywania zasobów.
mission2:
  name: Wyścig Zbrojeń
  desc: |
    W tej misji będziesz musiał skupić się na rozwoju silnej armii, aby bronić swojego królestwa przed potencjalnymi zagrożeniami.
    Twoim celem jest wyprodukowanie 40 łuków, włóczni, maczug i zbroi w ciągu najbliższych 20 lat.\n
    Aby to osiągnąć, będziesz musiał stworzyć solidny przemysł metalurgiczny, aby wytwarzać wysokiej jakości broń i zbroje.
    Może to wymagać budowy kuźni, warsztatów i kopalni, a także rekrutacji wykwalifikowanych rzemieślników.\n
    Należy pamiętać, że sukces w tej misji będzie zależeć od umiejętności równoważenia zasobów i ustalania priorytetów.
    Będziesz musiał ostrożnie zarządzać swoimi finansami i podejmować strategiczne decyzje, aby zapewnić bezpieczeństwo swojego królestwa. Powodzenia!
mission3:
  name: Uczta czy głód
  desc: |
    W tej misji będziesz musiał skupić się na produkcji żywności, aby utrzymać rosnącą populację. Twoim celem jest wyprodukowanie 250 jednostek chleba, 100 jednostek mięsa, 200 jednostek sera i 250 jednostek jabłek w ciągu najbliższych 20 lat.\n
    Aby to osiągnąć, będziesz musiał rozwinąć solidny system rolnictwa, aby uprawiać rośliny i hodować zwierzęta. Będzie to wymagało budowy farm, młynów i pastwisk, a także rekrutacji wykwalifikowanych robotników.\n
    Oprócz produkcji żywności, będziesz musiał również rozważyć przechowywanie i dystrybucję tych zasobów. Może to obejmować budowę spichlerzy i rynków do przechowywania i sprzedaży produktów.\n
    Należy pamiętać, że sukces w tej misji będzie zależał od umiejętności równoważenia zasobów i ustalania priorytetów. Będziesz musiał ostrożnie zarządzać swoimi finansami i podejmować strategiczne decyzje, aby zapewnić dobrobyt swojemu królestwu. Powodzenia!
mission4:
  name: Królewska Fortuna
  desc: |
    W tej misji twoim celem jest zgromadzenie znacznej ilości bogactwa poprzez zdobycie 5000 sztuk złota.
    W przeciwieństwie do poprzednich misji, nie ma limitu czasowego dla tego celu, więc będziesz mieć swobodę realizowania swoich celów we własnym tempie.\n
    Aby to osiągnąć, będziesz musiał rozwinąć silną gospodarkę, budując warsztaty i zarządzając nimi, inwestując w handel i podejmując strategiczne decyzje finansowe.\n
    Należy pamiętać, że sukces w tej misji będzie zależał od umiejętności mądrego inwestowania i ostrożnego zarządzania finansami.
    Będziesz musiał zrównoważyć swoje zasoby i podjąć skalkulowane ryzyko, aby zapewnić dobrobyt swojemu królestwu. Powodzenia!
mission5:
  name: Wiara w Architekturę
  desc: |
    W tej misji będziesz musiał skupić się na budowie wielkiej katedry, która będzie centralnym punktem życia religijnego i kulturalnego twojego królestwa.
    Twoim celem jest zbudowanie katedry w ciągu najbliższych 10 lat.\n
    Należy pamiętać, że powodzenie tej misji będzie zależeć od umiejętności zarządzania złożonym projektem budowlanym i efektywnego równoważenia zasobów.
    Będziesz musiał podejmować strategiczne decyzje i ostrożnie zarządzać swoim czasem, aby zapewnić ukończenie katedry w wyznaczonym terminie. Powodzenia!
