mission1:
  name: Madeira e Pedra
  desc: |
    Nesta missão, você precisará se concentrar na coleta de recursos para desenvolver a infraestrutura do seu Reino. Seu objetivo é coletar 50 unidades de madeira e 20 unidades de pedra nos próximos 5 anos.\n Para conseguir isso, você terá que criar uma rede de cabanas de lenhador e pedreiras para extrair esses recursos do ambiente circundante. Isso pode envolver a construção de depósitos para guardar seus recursos.
mission2:
  name: Corrida Armamentista
  desc: |
    Nesta missão, você precisará se concentrar no desenvolvimento de um exército forte para defender seu reino contra ameaças potenciais. Seu objetivo é produzir 40 unidades de arcos, lanças, maças e armaduras nos próximos 20 anos.\n Para conseguir isso, você precisará estabelecer uma indústria metalúrgica robusta para fabricar armas e armaduras de alta qualidade. Isso pode envolver a construção de ferreiros, oficinas e minas, bem como o recrutamento de artesãos qualificados.\n Tenha em mente que o seu sucesso nesta missão dependerá da sua capacidade de equilibrar os seus recursos e priorizar os seus objetivos. Você precisará gerenciar cuidadosamente suas finanças e tomar decisões estratégicas para garantir a segurança de seu reino. Boa sorte!
mission3:
  name: Banquete ou fome
  desc: |
    Nesta missão, você precisará se concentrar na produção de alimentos para sustentar a sua população crescente. Sua meta é produzir 250 unidades de pão, 100 unidades de carne, 200 unidades de queijo e 250 unidades de maçã nos próximos 20 anos.\n Para o conseguir, terá de desenvolver um sistema agrícola robusto para cultivar culturas e criar gado. Isto exigirá a construção de fazendas, moinhos e pastagens, bem como o recrutamento de trabalhadores qualificados.\n Além da produção de alimentos, será necessário considerar também o armazenamento e a distribuição desses recursos. Isso pode envolver a construção de celeiros e mercados para armazenar e vender os seus produtos.\n Tenha em mente que o seu sucesso nesta missão dependerá da sua capacidade de equilibrar seus recursos e priorizar seus objetivos. Você precisará administrar cuidadosamente suas finanças e tomar decisões estratégicas para garantir a prosperidade de seu reino. Boa sorte!
mission4:
  name: A Fortuna do Reino
  desc: |
    Nesta missão, seu objetivo é acumular uma quantidade substancial de riqueza adquirindo 5000 unidades de ouro. Ao contrário das missões anteriores, não há um limite de tempo para este objetivo, portanto, terá a liberdade de atingir seus objetivos no seu próprio ritmo.\n
    Para conseguir isso, você precisará desenvolver uma economia forte construindo e gerenciando oficinas, investindo em negociação e comércio e tomando decisões financeiras estratégicas.\n
    Tenha em mente que o seu sucesso nesta missão dependerá da sua capacidade de fazer investimentos sábios e gerenciar suas finanças com cuidado.
    Você precisará equilibrar seus recursos e assumir riscos calculados para garantir a prosperidade do seu reino. Boa sorte!
mission5:
  name: Fé na Arquitetura
  desc: |
    Nesta missão, você precisará focar em construir uma grande catedral para servir como peça central da vida religiosa e cultural do seu Reino.
    Seu objetivo é construir uma catedral dentro dos próximos 10 anos.\n
    Tenha em mente que o seu sucesso nesta missão dependerá da sua capacidade de gerenciar um projeto complexo de construção e equilibrar seus recursos de forma eficaz.
    Você precisará tomar decisões estratégicas e gerir o seu tempo com cuidado para garantir a conclusão da sua catedral dentro do período de tempo definido. Boa Sorte!
