mission1:
  name: Cherestea și piatră
  desc: |
    În această misiune, trebuie să concentrezi pe colectarea resurselor pentru a dezvolta infrastructura regatului tău.
    Scopul tău este să colectezi 50 de unități de lemn și 20 de unități de piatră în următoarele 5 ani.\n
    Pentru a realiza acest lucru, va trebui să creați o rețea de colibe și cariere de tăietori de lemne pentru a extrage aceste resurse din mediul înconjurător.
    Acest lucru poate implica construirea de depozite pentru a stoca resursele.
mission2:
  name: Cursa înarmărilor
  desc: |
    În această misiune, va trebui să te concentrezi pe dezvoltarea unei armate puternice pentru a-ți apăra regatul de potențiale amenințări.
    Obiectivul tău este să produci 40 de unități de arcuri, sulițe, macete și armuri în următorii 20 de ani.\n
    Pentru a realiza acest lucru, va trebui să înființați o industrie metalurgică robustă pentru a confecționa arme și armuri de înaltă calitate.
    Acest lucru poate implica construirea de fierării, ateliere și mine, precum și recrutarea de meșteri calificați.\n
    Reține că succesul în această misiune va depinde de abilitatea ta de a-ți echilibra resursele și de a-ți stabili prioritățile obiectivelor.
    Va trebui să-ți gestionezi cu atenție finanțele și să iei decizii strategice pentru a asigura siguranța și securitatea regatului tău. Mult noroc!
mission3:
  name: Festin sau foamete
  desc: |
    În această misiune, va trebui să te concentrezi pe producția de hrană pentru a-ți susţine populaţia în creştere. Scopul este de a produce 250 de unități de pâine,
    100 de unități de carne,
    200 unități de brânză şi 250 unități de mere în următorii 20 de ani.\n
    Pentru a realiza acest lucru, va trebui să dezvolți un sistem agricol solid pentru creşterea culturilor şi creşterea animalelor. Acest lucru va necesita construirea de ferme, mori și pășuni, precum și recrutarea de lucrători calificați.\n
    Pe lângă producția de hrană, va trebui să luați în considerare și stocarea și distribuirea acestor resurse. Acest lucru poate implica construirea de hambare şi piețe pentru a-ți stoca şi vinde produsele.\n
    Reține că succesul tău în această misiune va depinde de capacitatea ta de a echilibra resursele și de a prioritiza obiectivele. Va trebui să îți gestionezi cu atenție finanțele și să iei decizii strategice pentru a asigura prosperitatea regatului tău. Mult noroc!
mission4:
  name: Fortuna Regatului
  desc: |
    În această misiune, obiectivul tău este să acumulezi o cantitate considerabila de avere prin cumpărarea a 5000 de unități de aur.
    Spre deosebire de misiunile anterioare, nu există o limită de timp pentru acest obiectiv, astfel încât să aveți libertatea de a te urmări obiectivele în ritmul propriu.\n
    Pentru a realiza acest lucru, va trebui să dezvolți o economie puternică prin construirea și gestionarea atelierelor, investiții în comerț și comerț și luarea de decizii financiare strategice.\n
    Rețineți că succesul dumneavoastră în această misiune va depinde de capacitatea ta de a face investiții înțelepte și de a-ți gestiona finanțele cu atenție.
    Va trebui să soliciți resursele și să îți asumi riscuri calculate pentru a asigura prosperitatea regatului tău. Mult noroc!
mission5:
  name: Încredere în arhitectură
  desc: |
    În această misiune, va trebui să te concentrezi pe construirea unei mari catedrale care va servi drept centru al vieții religioase și culturale a regatului tău.
    Obiectivul tău este să construiești catedrala în următorii 10 ani.\n
    Rețineți că succesul în această misiune va depinde de capacitatea ta de a gestiona un proiect de construcție complex și de a echilibra eficient resursele.
    Va trebui să luați decizii strategice și să îți gestionați timpul cu atenție pentru a asigura că catedrala este finalizată la timp. Mult succes!
