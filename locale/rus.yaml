mission1:
  name: Дерево и камень
  desc: |
    В этой миссии вам нужно сосредоточиться на сборе ресурсов для развития вашего королевства.
    Цель - добыть 50 единиц древесины и 20 единиц камня в течение следующих 5 лет.\n
    Для достижения этой цели вам потребуется создать сеть лесопилок и каменоломен.
    Возможно вам потребуется построить склад для хранения ваших ресурсов.
mission2:
  name: Гонка вооружений
  desc: |
    В этой миссии вам нужно будет сосредоточиться на создании сильной армии для защиты вашего королевства от потенциальных угроз.
    Ваша цель - произвести по 40 луков, копий, булав и железных доспехов в течение следующих 20 лет.\n
    Вам нужно будет создать мощную металлообрабатывающую промышленность для изготовления высококачественного оружия и доспехов.
    Для этого необходимо построить кузницы, мастерские и шахты.\n
    Имейте в виду, что ваш успех в этой миссии будет зависеть от вашей способности распределять ресурсы и расставлять приоритеты.
    Вам нужно будет тщательно управлять своими финансами и принимать стратегические решения, чтобы обеспечить безопасность вашего королевства. Удачи!
mission3:
  name: Пиршество или голод
  desc: |
    В этой миссии вам нужно будет сосредоточиться на производстве продуктов питания, чтобы поддерживать свое растущее население. Ваша цель - произвести 250 единиц хлеба, 100 единиц мяса, 200 единиц сыра и 250 единиц яблок в течение следующих 20 лет.\n
    Чтобы достичь этого, вам нужно будет создать надежную систему ферм для выращивания культур и разведения скота. Это потребует строительства ферм, мельниц и пастбищ.\n
    Помимо производства продуктов питания, вам также необходимо будет подумать о хранении и распределении этих ресурсов. Для этого необходимо построить амбары и рынки для хранения и продажи вашей продукции.\n
    Имейте в виду, что ваш успех в этой миссии будет зависеть от вашей способности распределять ресурсы и расставлять приоритеты. Вам нужно будет тщательно управлять своими финансами и принимать стратегические решения, чтобы обеспечить процветание вашего королевства. Удачи!
mission4:
  name: Золото королевства
  desc: |
    В этой миссии ваша цель состоит в накоплении 5000 единиц золота - значительного богатства.
    В отличие от предыдущих миссий, эта цель не ограничена по времени, поэтому у вас будет возможность двигаться к цели в своём темпе.\n
    Чтобы достичь цели вам нужно будет развить сильную экономику, строя мастерские и управляя ими, инвестируя в торговлю и принимая важные финансовые решения.\n
    Имейте в виду, что ваш успех в этой миссии будет зависеть от вашей способности делать разумные вложения и управлять своими финансами.
    Вам нужно будет сбалансировать свои ресурсы и пойти на просчитанный риск, чтобы обеспечить процветание вашего королевства. Удачи!
mission5:
  name: Вера в архитектуру
  desc: |
    В этой миссии вам нужно будет сосредоточиться на строительстве грандиозного собора, который станет центром религиозной и культурной жизни вашего королевства.
    Ваша цель - построить собор в течение следующих 10 лет.\n
    Имейте в виду, что ваш успех в этой миссии будет зависеть от вашей способности управлять сложным строительным проектом и умения эффективно распределять ресурсы.
    Вам нужно будет принимать взвешенные решения и тщательно распоряжаться своим временем, чтобы обеспечить строительство собора в отведенные сроки. Удачи!
