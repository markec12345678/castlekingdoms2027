mission1:
    name: Les in Kamen
    desc: |
      V tem poslanstvu se boste osredotočili na zbiranje surovin za razvoj infrastrukture vašega kraljestva.
      Vaš cilj je zbrati 50 enot lesa in 20 enot kamna v naslednjih 5 letih.\n
      Da to dosežete, boste morali vzpostaviti mrežo kolib za drvarje in kamnolomov za pridobivanje teh surovin iz okolice.
      To lahko vključuje gradnjo skladišč za shranjevanje surovin.
mission2:
    name: Tekma v oboroževanju
    desc: |
      V tem poslanstvu se boste osredotočili na razvoj močne vojske za obrambo kraljestva pred morebitnimi grožnjami.
      Vaš cilj je proizvesti 40 enot lokov, kopij, buzdovanov in oklepov v naslednjih 20 letih.\n
      Da to dosežete, boste morali vzpostaviti močno kovinsko industrijo za izdelavo visokokakovostnega orožja in oklepov.
      To lahko vključuje gradnjo kovačij, delavnic in rudnikov ter rekrutiranje spretnih obrtnikov.\n
      Ne pozabite, da bo vaš uspeh v tem poslanstvu odvisen od vaše sposobnosti uravnoteženja surovin in določanja prioritet.
      Skrbno boste morali upravljati finance in sprejemati strateške odločitve za zagotovitev varnosti vašega kraljestva. Vso srečo!
mission3:
    name: Praznik ali lakota
    desc: |
      V tem poslanstvu se boste osredotočili na pridelavo hrane za preživetje rastočega prebivalstva. Vaš cilj je proizvesti 250 enot kruha,
      100 enot mesa,
      200 enot sira in 250 enot jabolk v naslednjih 20 letih.\n
      Da to dosežete, boste morali razviti močan kmetijski sistem za pridelovanje pridelkov in rejo živine. To bo zahtevalo gradnjo kmetij, mlinov in pašnikov ter rekrutiranje spretnih delavcev.\n
      Poleg pridelave hrane boste morali razmisliti tudi o shranjevanju in distribuciji teh surovin. To lahko vključuje gradnjo žitnic in trgov za shranjevanje in prodajo vaših izdelkov.\n
      Ne pozabite, da bo vaš uspeh v tem poslanstvu odvisen od vaše sposobnosti uravnoteženja surovin in določanja prioritet. Skrbno boste morali upravljati finance in sprejemati strateške odločitve za zagotovitev blaginje vašega kraljestva. Vso srečo!
mission4:
    name: Bogastvo kraljestva
    desc: |
      V tem poslanstvu je vaš cilj akumulirati veliko bogastvo s pridobitvijo 5000 enot zlata.
      V nasprotju s prejšnjimi poslanstvi pri tem cilju ni časovne omejitve, zato boste lahko svoje cilje dosegali v svojem tempu.\n
      Da to dosežete, boste morali razviti močno gospodarstvo z gradnjo in upravljanjem delavnic, vlaganjem v trgovino in sprejemanjem strateških finančnih odločitev.\n
      Ne pozabite, da bo vaš uspeh v tem poslanstvu odvisen od vaše sposobnosti pametnega vlaganja in skrbnega upravljanja financ.
      Balansirati boste morali svoje surovine in prevzemati izračunana tveganja za zagotovitev blaginje vašega kraljestva. Vso srečo!
mission5:
    name: Vera v arhitekturo
    desc: |
      V tem poslanstvu se boste osredotočili na gradnjo veličastne katedrale, ki bo središče verskega in kulturnega življenja vašega kraljestva.
      Vaš cilj je zgraditi katedralo v naslednjih 10 letih.\n
      Ne pozabite, da bo vaš uspeh v tem poslanstvu odvisen od vaše sposobnosti upravljanja kompleksnega gradbenega projekta in učinkovitega uravnoteženja surovin.
      Sprejemali boste strateške odločitve in skrbno upravljali svoj čas za zagotovitev dokončanja katedrale v predvidenem roku. Vso srečo!
