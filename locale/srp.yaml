mission1:
  name: Дрво и камен
  desc: 'У овој мисији фокусирајте се на прикупљање ресурса за развој инфраструктуре
    вашег краљевства.

    Ваш циљ је прикупити 50 јединица дрвета и 20 јединица камена у наредних 5 година.

    Да бисте то постигли, успоставите мрежу колиба дрвосеча и каменолома.'
mission2:
  name: Трка у наоружању
  desc: 'У овој мисији развијте јаку војску за одбрану краљевства.

    Ваш циљ је произвести 40 јединица лукова, копаља, буздовања и оклопа у наредних
    20 година.'
mission3:
  name: Гозба или глад
  desc: 'У овој мисији фокусирајте се на производњу хране.

    Ваш циљ је произвести 250 јединица хлеба, 100 јединица меса, 200 јединица сира
    и 250 јединица јабука у наредних 20 година.'
mission4:
  name: Богатство краљевства
  desc: 'У овој мисији ваш циљ је акумулирати 5000 јединица злата.

    Развијте снажну економију кроз трговину и занате.'
mission5:
  name: Вера у архитектуру
  desc: У овој мисији изградите величанствену катедралу у наредних 10 година.
