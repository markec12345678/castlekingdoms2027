mission1:
  name: Деревина та Камінь
  desc: |
    В цьому завданні, тобі потрібно сфокусуватись на видобуванні ресурсів, щоб розвинути рівень інфраструктури свого королівства.
    Твоєю задачею буде зібрати 50 одиниць дерева та 20 одиниць каменю за 5 років.\n
    Щоб добитися цього, тобі потрібно створити мережу будинків лісорубів та каменоломень, щоб видобути ресурси з оточуючого світу.
    Це може призвести до побудови складу, щоб зберігати твої ресурси.
mission2:
  name: Перегони озброєння
  desc: |
    У цьому завданні вам потрібно буде сфокусуватися на розвитку сильної армії, щоб захистити ваше королівство від потенційних загроз.
    Ваша задача - виготовити 40 одиниць луків, списів, булав і обладунків протягом наступних 20 років.\n
    Щоб досягти це, вам потрібно буде створити потужну металообробну промисловість для виготовлення високоякісної зброї та броні.
    Це може включати будівництво ковалень, майстерень і шахт, а також наймання кваліфікованих майстрів.\n
    Майте на увазі, що ваш успіх у цьому завданні залежатиме від вашої здатності збалансувати ваші ресурси та визначити пріорітетність ваших цілей.
    Вам потрібно буде уважно розпоряджатися вашими фінансами та робити стратегічні рішення для гарантування безпеки вашого королівства. Щасти!
mission3:
  name: Банкет або голод
  desc: |
    У цій місії вам потрібно буде зосередитися на виробництві їжі, щоб підтримувати зростання вашого населення.
    Ваша ціль - виготовити 250 одиниць хліба,
    100 одиниць м'яса,
    200 одиниць сиру та 250 одиниць яблук протягом наступних 20 років.\n
    Щоб досягти цього, вам потрібно буде розробити надійну систему сільського господарства, щоб вирощувати зернові культури та розводити худобу. Для цього знадобиться будівництво ферм, млинів і пасовищ, а також наймання кваліфікованих робітників.\n
    Окрім виробництва їжі, вам також потрібно буде розглянути питання про зберігання та розподіл цих ресурсів. Це може включати будівництво зерносховищ та ринків для зберігання та продажу ваших продуктів.\n
    Майте на увазі, що ваш успіх у цій місії залежатиме від вашого вміння збалансувати ваші ресурси та визначити пріорітетність ваших цілей. Вам потрібно буде ретельно розпоряджатися своїми фінансами та приймати стратегічні рішення, щоб забезпечити процвітання свого королівства. Щасти!
mission4:
  name: Доля королівства
  desc: |
    У цій місії ваша мета полягає в тому, щоб накопичити значні багатства, придбавши 5000 одиниць золота.
    На відміну від попередніх місій, це завдання не обмежене часом, тож ви матимете свободу досягти ваших цілей у власному темпі.\n
    Щоб досягти цього, вам потрібно буде розвинути сильну економіку, будуючи та керуючи майстернями, інвестуючи в торгівлю та комерцію та приймаючи стратегічні фінансові рішення.\n
    Майте на увазі, що ваш успіх у цій місії залежатиме від вашої здатності робити мудрі інвестиції та ретельно розпоряджатися вашими фінансами.
    Вам потрібно буде збалансувати свої ресурси та прийняти прораховані ризики, щоб забезпечити процвітання свого королівства. Щасти!
mission5:
  name: Віра в архітектуру
  desc: |
    У цій місії вам потрібно буде зосередитися на будівництві величного собору, який стане центром релігійного та культурного життя вашого королівства.
    Ваша задача - побудувати собор протягом наступних 10 років.\n
    Майте на увазі, що ваш успіх у цій місії залежатиме від вашої здатності керувати складним будівельним проектом і ефективно балансувати ваші ресурси.
    Вам потрібно буде приймати стратегічні рішення та ретельно розпоряджатися своїм часом, щоб забезпечити завершення будівництва вашого собору у відведений термін. Щасти!
